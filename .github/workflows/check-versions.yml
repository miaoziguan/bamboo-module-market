name: Check module versions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 校验 manifest 与模块文件头版本一致
        run: node scripts/check-versions.mjs
      - name: 校验 blog 质感增强的关档回退契约
        run: node scripts/check-fx.mjs
